openapi: 3.0.3
info:
  title: Soge.dk Public API
  version: "1.0.0"
  description: |
    Free & paid REST API for Danish public data — **vehicles** (DMR / Motorregister),
    **companies** (CVR / Virk), **addresses** (DAWA-compatible) and **phone** lookups.

    - Base URL: `https://soge.dk/api/v1`
    - Auth: send your key in the **`X-API-KEY`** header on every request (except `/health`).
    - Get a key (free tier available): https://soge.dk/pricing
    - The same key also powers the **MCP server** for AI agents — see the repo README.

    Plans: a free tier covers the core lookups; endpoints tagged **Premium** require a paid plan
    and return a clear "requires a paid plan" message otherwise.
  contact:
    name: Soge.dk
    url: https://soge.dk
  license:
    name: Proprietary (data © official Danish registries)
    url: https://soge.dk

servers:
  - url: https://soge.dk/api/v1
    description: Production

security:
  - ApiKeyAuth: []

tags:
  - name: System
    description: Health & status
  - name: Vehicles
    description: Danish Motor Register (DMR) lookups
  - name: Companies
    description: Central Business Register (CVR / Virk) lookups
  - name: People
    description: Person-level company involvement (CVR enhedsNummer)
  - name: Reviews
    description: User reviews & aggregateRating (companies & vehicle models)

paths:
  /health:
    get:
      tags: [System]
      summary: Health check
      description: Service liveness probe. No API key required.
      security: []
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /vehicles/{identifier}:
    get:
      tags: [Vehicles]
      summary: Get vehicle data
      description: |
        Full vehicle record by **registration number** (nummerplade) or **VIN** (stelnummer):
        make/model, specs, fuel/EV, green tax, technical data and status. Free tier.
      parameters:
        - $ref: "#/components/parameters/VehicleIdentifier"
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /companies/{query}:
    get:
      tags: [Companies]
      summary: Search companies
      description: Search Danish companies by **CVR number**, **name** or free text. Free tier.
      parameters:
        - name: query
          in: path
          required: true
          schema: { type: string }
          description: CVR number, company name, or free-text query
          example: "novo nordisk"
        - name: page
          in: query
          required: false
          schema: { type: integer, default: 1, minimum: 1 }
        - name: size
          in: query
          required: false
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /companies-at-address:
    get:
      tags: [Companies]
      summary: Companies at an address
      description: List companies registered at a Danish address. Free tier.
      parameters:
        - name: vejkode
          in: query
          schema: { type: string }
          description: Street code (vejkode)
        - name: husnr
          in: query
          schema: { type: string }
          description: House number
        - name: postnr
          in: query
          schema: { type: string }
          description: Postal code
          example: "1050"
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /koretoj/{identifier}/inspections:
    get:
      tags: [Vehicles]
      summary: Vehicle inspection history (syn)
      description: |
        **Premium.** Official periodic-inspection (syn) history: result, odometer reading,
        defects, station and report PDFs.
      parameters:
        - $ref: "#/components/parameters/VehicleIdentifier"
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }

  /koretoj/{identifier}/insurance:
    get:
      tags: [Vehicles]
      summary: Vehicle insurance status
      description: "**Premium.** Insurer, current status, history and block/seizure flags."
      parameters:
        - $ref: "#/components/parameters/VehicleIdentifier"
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }

  /koretoj/{vin}/odometer:
    get:
      tags: [Vehicles]
      summary: Odometer history + rollback detection
      description: "**Premium.** Odometer readings over time with rollback-fraud detection."
      parameters:
        - name: vin
          in: path
          required: true
          schema: { type: string }
          description: VIN (stelnummer)
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }

  /koretoj/{identifier}/recalls:
    get:
      tags: [Vehicles]
      summary: Safety recalls
      description: "**Premium.** Open safety recalls matched to the vehicle's make/model."
      parameters:
        - $ref: "#/components/parameters/VehicleIdentifier"
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }

  /cvr/{cvr}/ownership:
    get:
      tags: [Companies]
      summary: Ownership / control graph
      description: "**Premium.** Real owners and control relationships for a company."
      parameters:
        - $ref: "#/components/parameters/Cvr"
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }

  /cvr/{cvr}/financials:
    get:
      tags: [Companies]
      summary: Annual-report financials
      description: "**Premium.** Annual-report figures with a 2-year comparison."
      parameters:
        - $ref: "#/components/parameters/Cvr"
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }

  /cvr/person/{enhedsNummer}/companies:
    get:
      tags: [People]
      summary: Companies a person is involved in
      description: "**Premium.** Every company linked to a person (by CVR enhedsNummer)."
      parameters:
        - $ref: "#/components/parameters/EnhedsNummer"
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }

  /cvr/person/{enhedsNummer}/bankruptcies:
    get:
      tags: [People]
      summary: Person bankruptcy history
      description: "**Premium.** Serial-bankruptcy radar for a person (by CVR enhedsNummer)."
      parameters:
        - $ref: "#/components/parameters/EnhedsNummer"
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }

  /koretoj/{identifier}/full:
    get:
      tags: [Vehicles]
      summary: Full vehicle report (everything the site shows)
      description: |
        **Premium.** The complete vehicle report in ONE call — parity with the soge.dk vehicle
        page: core DMR data, equipment, syn, fuels, derived powertrain/lifecycle/origin, green-tax
        & next-syn calculators, model fault & fleet stats, miljøzone/import flags, fuel-segment
        economy, plus live enrichments (insurance, full DMR-kerne walk, eSyn inspections, recalls,
        Bilbogen liens, EU Safety Gate alerts, EV battery/range, valuations, market price).
      parameters:
        - $ref: "#/components/parameters/VehicleIdentifier"
        - name: include_live
          in: query
          required: false
          schema: { type: boolean, default: true }
          description: Set false for the instant DB-only tier (skips external scrapes).
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "404": { $ref: "#/components/responses/NotFound" }

  /koretoj/{identifier}/dmr:
    get:
      tags: [Vehicles]
      summary: Full DMR-kerne walk
      description: |
        **Premium.** The technical/equipment/leasing tabs the weekly bulk dump lacks: battery
        capacity, electric range, measured consumption, the Ekstraudstyr list, the registry's own
        next-inspection date, leasing period and block/seizure status.
      parameters:
        - $ref: "#/components/parameters/VehicleIdentifier"
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "404": { $ref: "#/components/responses/NotFound" }

  /koretoj/{identifier}/valuations:
    get:
      tags: [Vehicles]
      summary: DMR valuation history
      description: "**Premium.** Official DMR valuations (vurderinger) behind registration tax."
      parameters:
        - $ref: "#/components/parameters/VehicleIdentifier"
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "404": { $ref: "#/components/responses/NotFound" }

  /koretoj/{identifier}/liens:
    get:
      tags: [Vehicles]
      summary: Car debt / liens (Bilbogen)
      description: |
        **Premium.** Liens registered against the vehicle in Bilbogen / Tinglysning — is this car
        pledged as security for a loan?
      parameters:
        - $ref: "#/components/parameters/VehicleIdentifier"
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "404": { $ref: "#/components/responses/NotFound" }

  /koretoj/{identifier}/safety-alerts:
    get:
      tags: [Vehicles]
      summary: EU Safety Gate (RAPEX) alerts
      description: |
        Brand-level EU Safety Gate product-safety alerts matched to the vehicle's make/model —
        distinct from manufacturer recalls. Free tier.
      parameters:
        - $ref: "#/components/parameters/VehicleIdentifier"
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /koretoj/{identifier}/ev-specs:
    get:
      tags: [Vehicles]
      summary: EV / PHEV battery & range
      description: "Battery capacity, electric range and consumption (OpenEV). Free tier. 404 for pure-combustion."
      parameters:
        - $ref: "#/components/parameters/VehicleIdentifier"
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /koretoj/{identifier}/tax:
    get:
      tags: [Vehicles]
      summary: Green owner-tax + next-syn schedule
      description: "Grøn ejerafgift / CO2-afgift and the next periodic-inspection schedule. Free tier."
      parameters:
        - $ref: "#/components/parameters/VehicleIdentifier"
        - name: lang
          in: query
          required: false
          schema: { type: string, enum: [en, da, uk], default: en }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /models/{make}/{model}/stats:
    get:
      tags: [Vehicles]
      summary: Per-model fleet & fault stats
      description: "Fleet stats (count, age, fuel/colour mix, avg mileage) + inspection-fault profile. Free tier."
      parameters:
        - name: make
          in: path
          required: true
          schema: { type: string }
          example: "Toyota"
        - name: model
          in: path
          required: true
          schema: { type: string }
          example: "Corolla"
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /cvr/{cvr}/network:
    get:
      tags: [Companies]
      summary: Multi-degree company network
      description: |
        **Premium.** Owners, management, founders and shared-contact links (phone/email/domain)
        across all relationship kinds, with status colours. The expensive graph builds in the
        background — a cold company returns **202** with `retry_after`; re-request shortly.
      parameters:
        - $ref: "#/components/parameters/Cvr"
        - name: depth
          in: query
          required: false
          schema: { type: integer, default: 2, minimum: 1, maximum: 3 }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "202":
          description: Graph is building; retry after `retry_after` seconds
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object, nullable: true }
                  status: { type: string, example: building }
                  retry_after: { type: integer, example: 3 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }

  /cvr/phone/{phone}:
    get:
      tags: [Companies]
      summary: Reverse phone lookup
      description: |
        Every company that registered this exact phone number in CVR — on the company record or on
        one of its production units. Each company carries `status`, `active`, `branche`, and the
        number's registration there: `phone_current` (still registered to it), `phone_from`,
        `phone_to` (null while current) and `phone_registered_on` (`company` and/or `p_unit`).
        Free tier.
      parameters:
        - name: phone
          in: path
          required: true
          schema: { type: string }
          example: "46321499"
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /cvr/stats:
    get:
      tags: [Companies]
      summary: CVR corpus totals
      description: "Total companies + new registrations (day / week). Free tier."
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /reviews/{target_type}/{target_id}:
    get:
      tags: [Reviews]
      summary: Reviews + aggregateRating
      description: |
        Approved user reviews and the aggregateRating summary for a company or vehicle model —
        the same ratings the site renders. Free tier.
      parameters:
        - name: target_type
          in: path
          required: true
          schema: { type: string, enum: [company, vehicle_model] }
        - name: target_id
          in: path
          required: true
          schema: { type: string }
          description: CVR number (company) or make/model slug (vehicle_model)
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-KEY

  parameters:
    VehicleIdentifier:
      name: identifier
      in: path
      required: true
      schema: { type: string }
      description: Registration number (nummerplade) or VIN (stelnummer)
      example: "AB12345"
    Cvr:
      name: cvr
      in: path
      required: true
      schema: { type: string }
      description: 8-digit CVR number
      example: "25052943"
    EnhedsNummer:
      name: enhedsNummer
      in: path
      required: true
      schema: { type: string }
      description: CVR person unit number (enhedsNummer)

  responses:
    Ok:
      description: Success
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { type: object, description: Endpoint-specific payload }
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "Invalid API key", code: 401 }
    PaymentRequired:
      description: Endpoint requires a paid plan
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "This endpoint requires a paid plan", code: 402 }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "Not found", code: 404 }
    RateLimited:
      description: Rate limit exceeded (tiered by plan)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "Rate limit exceeded", code: 429 }

  schemas:
    Health:
      type: object
      properties:
        status: { type: string, example: healthy }
        service: { type: string, example: "Soge.dk API" }
    Error:
      type: object
      properties:
        error: { type: string }
        code: { type: integer }
